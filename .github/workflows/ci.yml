name: CI

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build registry
        run: pnpm registry:build

      - name: Build docs app
        run: pnpm build:web

      - name: Build Storybook
        run: pnpm build:storybook

      - name: Install Playwright browsers
        run: pnpm --filter @ghibli/web exec playwright install --with-deps chromium

      - name: Playwright smoke
        run: pnpm test:e2e
