# The type check (.github/workflows/typecheck.yaml): mypy --strict over the repo's Python, `Any` an error. One a
# third-party boundary needs carries `# type: ignore[explicit-any]  # <why>`.
[mypy]
python_version = 3.12
files = packages/paper/make_paper.py
strict = True
warn_unreachable = True
disallow_any_explicit = True
disallow_any_unimported = True
disallow_any_decorated = True
enable_error_code = ignore-without-code,possibly-undefined,truthy-bool
